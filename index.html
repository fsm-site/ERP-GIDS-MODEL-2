<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscription Manager — Developer Only</title>
<style>
  :root{
    --bg:#0b1220; --card:#141d33; --line:#28324a; --text:#eaf0ff; --muted:#8ea0c8;
    --blue:#4c8dff; --blue-dim:#1c2b4a; --green:#2ecc71; --red:#ff5c5c; --amber:#f5a623;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:460px; background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:32px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  h1{ font-size:20px; margin:0 0 4px; letter-spacing:.3px; }
  .sub{ font-size:13px; color:var(--muted); margin:0 0 24px; line-height:1.5; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; }
  .field input, .field select{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    background:#0e1526; color:var(--text); font-size:14px; font-family:inherit;
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--blue); }
  .pw-field{ position:relative; }
  .pw-field input{ padding-right:38px; }
  .pw-eye{
    position:absolute; right:4px; top:50%; transform:translateY(-50%); background:transparent;
    border:0; cursor:pointer; font-size:15px; padding:6px; color:var(--muted);
  }
  .btn{
    width:100%; padding:11px; border-radius:8px; border:0; font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .btn-primary{ background:var(--blue); color:#fff; }
  .btn-primary:disabled{ opacity:.6; cursor:default; }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--line); margin-top:10px; }
  .error{ color:var(--red); font-size:13px; margin:10px 0 0; min-height:16px; }
  .success{ color:var(--green); font-size:13px; margin:10px 0 0; min-height:16px; }
  .divider{ height:1px; background:var(--line); margin:20px 0; }
  .status-pill{
    display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px;
    font-size:12px; font-weight:700; letter-spacing:.3px;
  }
  .status-active{ background:rgba(46,204,113,.15); color:var(--green); }
  .status-suspended{ background:rgba(255,92,92,.15); color:var(--red); }
  .status-unknown{ background:rgba(245,166,35,.15); color:var(--amber); }
  .row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .branch-check{ display:flex; align-items:center; gap:8px; padding:8px 0; font-size:14px; }
  .branch-check input{ width:16px; height:16px; }
  .top-user{ font-size:12px; color:var(--muted); margin-bottom:20px; word-break:break-all; }
  .logout-link{ background:none; border:0; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
  #app-view{ display:none; }
  .loading-note{ font-size:12px; color:var(--muted); text-align:center; padding:20px 0; }
</style>
</head>
<body>

  <!-- ===================== LOGIN VIEW ===================== -->
  <div class="card" id="login-view">
    <h1>Subscription Manager</h1>
    <p class="sub">Developer-only tool. Controls GIDS AYPHONE TECH's subscription status. This account has no access to business data — only the subscriptions record.</p>

    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="your developer email" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <div class="pw-field">
        <input type="password" id="login-password" placeholder="password" autocomplete="current-password">
        <button type="button" class="pw-eye" onclick="togglePw()">👁</button>
      </div>
    </div>

    <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Log in</button>
    <div class="error" id="login-error"></div>
  </div>

  <!-- ===================== APP VIEW ===================== -->
  <div class="card" id="app-view">
    <div class="row">
      <h1 style="margin:0;">Subscription</h1>
      <button class="logout-link" onclick="doLogout()">Log out</button>
    </div>
    <div class="top-user" id="signed-in-as"></div>

    <div class="row">
      <span style="font-size:13px;color:var(--muted);">Current status</span>
      <span class="status-pill" id="current-status-pill">—</span>
    </div>
    <div class="row" style="margin-top:-8px;">
      <span style="font-size:12px;color:var(--muted);">Last updated</span>
      <span style="font-size:12px;color:var(--muted);" id="last-updated-text">—</span>
    </div>

    <div class="divider"></div>

    <div class="field">
      <label>Status</label>
      <select id="f-status">
        <option value="active">active</option>
        <option value="suspended">suspended</option>
      </select>
    </div>

    <div class="field">
      <label>Plan</label>
      <input type="text" id="f-plan" placeholder="e.g. trial, monthly, annual">
    </div>

    <div class="field">
      <label>Expires On</label>
      <input type="date" id="f-expires">
    </div>

    <div class="field">
      <label>Active Branches</label>
      <div id="branch-checks"></div>
    </div>

    <button class="btn btn-primary" id="save-btn" onclick="saveSubscription()">Save changes</button>
    <div class="error" id="save-error"></div>
    <div class="success" id="save-success"></div>
  </div>

  <div class="loading-note" id="loading-note" style="display:none;">Loading…</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  // Must match index.html's Firebase config exactly (same gids-erp project).
  const firebaseConfig = {
    apiKey: "AIzaSyAJC9PfhLmSvIrUdy4MPj_IRhodJQCjHBo",
    authDomain: "gids-erp.firebaseapp.com",
    projectId: "gids-erp",
    storageBucket: "gids-erp.firebasestorage.app",
    messagingSenderId: "515037466934",
    appId: "1:515037466934:web:04f5a96156d56167a76397",
    measurementId: "G-RJSHWHQ2CY"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const subRef = db.collection("subscriptions").doc("gids-tech");

  const BRANCHES = [
    { name: "San Antonio", id: "branch1" },
    { name: "Bataan", id: "branch2" },
    { name: "Angeles", id: "branch3" }
  ];

  function togglePw(){
    const input = document.getElementById("login-password");
    input.type = input.type === "password" ? "text" : "password";
  }

  async function doLogin(){
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const err = document.getElementById("login-error");
    err.textContent = "";
    if(!email || !password){ err.textContent = "Enter email and password."; return; }

    const btn = document.getElementById("login-btn");
    btn.disabled = true;
    btn.textContent = "Signing in...";
    try{
      await auth.signInWithEmailAndPassword(email, password);
      // onAuthStateChanged below handles the rest.
    }catch(error){
      console.error(error);
      err.textContent = describeError(error);
    }finally{
      btn.disabled = false;
      btn.textContent = "Log in";
    }
  }

  function doLogout(){
    auth.signOut();
  }

  function describeError(error){
    const code = error?.code || "";
    if(code === "auth/invalid-credential" || code === "auth/user-not-found" || code === "auth/wrong-password"){
      return "Incorrect email or password.";
    }
    if(code === "permission-denied"){
      return "Signed in, but Firestore denied access. Check that the Security Rule for this UID is in place.";
    }
    return error?.message || "Something went wrong.";
  }

  function renderBranchChecks(activeBranchIds){
    const container = document.getElementById("branch-checks");
    container.innerHTML = BRANCHES.map(b => `
      <label class="branch-check">
        <input type="checkbox" value="${b.id}" ${activeBranchIds.includes(b.id) ? "checked" : ""}>
        ${b.name} (${b.id})
      </label>
    `).join("");
  }

  function getCheckedBranchIds(){
    return Array.from(document.querySelectorAll("#branch-checks input:checked")).map(el => el.value);
  }

  function toDateInputValue(value){
    if(!value) return "";
    const d = value.toDate ? value.toDate() : new Date(value);
    if(Number.isNaN(d.getTime())) return "";
    return d.toISOString().slice(0,10);
  }

  let currentStartsAt = null;

  function formatDateTime(value){
    if(!value) return "—";
    const d = value.toDate ? value.toDate() : new Date(value);
    if(Number.isNaN(d.getTime())) return "—";
    return d.toLocaleString();
  }

  async function loadSubscription(){
    const loadingNote = document.getElementById("loading-note");
    loadingNote.style.display = "block";
    try{
      const snap = await subRef.get();
      const data = snap.exists ? snap.data() : { status:"suspended", plan:"", expiresAt:null, activeBranchIds:[] };
      currentStartsAt = data.startsAt || null;

      const pill = document.getElementById("current-status-pill");
      const status = data.status || "unknown";
      pill.textContent = status;
      pill.className = "status-pill " + (status === "active" ? "status-active" : status === "suspended" ? "status-suspended" : "status-unknown");

      document.getElementById("last-updated-text").textContent = formatDateTime(data.updatedAt);
      document.getElementById("f-status").value = status === "active" ? "active" : "suspended";
      document.getElementById("f-plan").value = data.plan || "";
      document.getElementById("f-expires").value = toDateInputValue(data.expiresAt);
      renderBranchChecks(Array.isArray(data.activeBranchIds) ? data.activeBranchIds : []);
    }catch(error){
      console.error(error);
      document.getElementById("save-error").textContent = describeError(error);
    }finally{
      loadingNote.style.display = "none";
    }
  }

  async function saveSubscription(){
    const err = document.getElementById("save-error");
    const success = document.getElementById("save-success");
    err.textContent = "";
    success.textContent = "";

    const status = document.getElementById("f-status").value;
    const plan = document.getElementById("f-plan").value.trim();
    const expiresStr = document.getElementById("f-expires").value;
    const activeBranchIds = getCheckedBranchIds();

    if(!expiresStr){
      err.textContent = "Please set an expiry date.";
      return;
    }

    const expiresDate = new Date(expiresStr + "T23:59:59");

    const btn = document.getElementById("save-btn");
    btn.disabled = true;
    btn.textContent = "Saving...";
    try{
      const payload = {
        status,
        plan: plan || "unspecified",
        expiresAt: firebase.firestore.Timestamp.fromDate(expiresDate),
        maxBranches: activeBranchIds.length,
        activeBranchIds,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      if(!currentStartsAt){
        payload.startsAt = firebase.firestore.FieldValue.serverTimestamp();
      }
      await subRef.set(payload, { merge: true });

      success.textContent = "Saved.";
      await loadSubscription();
    }catch(error){
      console.error(error);
      err.textContent = describeError(error);
    }finally{
      btn.disabled = false;
      btn.textContent = "Save changes";
    }
  }

  auth.onAuthStateChanged((user) => {
    if(user){
      document.getElementById("login-view").style.display = "none";
      document.getElementById("app-view").style.display = "block";
      document.getElementById("signed-in-as").textContent = "Signed in as " + user.email;
      loadSubscription();
    }else{
      document.getElementById("login-view").style.display = "block";
      document.getElementById("app-view").style.display = "none";
    }
  });
</script>

</body>
</html>
